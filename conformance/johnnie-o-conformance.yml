domain_standard:
  id: ucp
  name: Universal Commerce Protocol
  version: '2026-04-08'
  conforms: true
  declared_in_contract: true
  evidence: >-
    https://checkout.johnnie-o.com/.well-known/ucp returns a UCP merchant profile declaring
    ucp.version 2026-04-08, supported_versions 2026-04-08 and 2026-01-23, the
    dev.ucp.shopping service over mcp transport, and the capability set
    dev.ucp.shopping.checkout / .cart / .fulfillment / .discount with payment handlers
    dev.shopify.shop_pay, dev.shopify.card and google_pay. The MCP endpoint echoes it in the
    x-shopify-ucp-mcp-api-version response header.
  spec: https://ucp.dev/2026-04-08/specification/overview/
  market: retail commerce / agentic shopping
  why_it_matters: >-
    An agent that already speaks UCP can search, cart, check out and track orders at this
    store with no bespoke connector. That is the whole point of the standard, and it is
    declared in the contract rather than claimed on a marketing page.
