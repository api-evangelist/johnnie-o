aid: johnnie-o
name: Johnnie-O
description: >-
  Johnnie-O is a Los Angeles based men's, women's and boys' apparel brand founded in 2005 by
  John O'Donnell, blending East Coast prep with West Coast casual across polos, performance
  golf shirts, outerwear, shorts and collegiate Game Day licensed product, sold direct through
  johnnie-o.com, its own retail stores, wholesale and green-grass golf accounts. It is an
  apparel company, not a software vendor, and it operates no developer program, publishes no
  API documentation, ships no SDK and has no GitHub organization. It does, however, expose two
  real anonymous machine-readable surfaces through the Shopify Hydrogen storefront it runs: an
  introspectable Storefront GraphQL endpoint on its own domain, and a live Universal Commerce
  Protocol (UCP) MCP endpoint on its Shopify-served primary domain that publishes thirteen
  agent tools for catalog search, cart, checkout and order lookup. The store also serves its
  own llms.txt and agents.md agent instructions. Those surfaces are Shopify platform
  infrastructure running under Johnnie-O's tenant and on hosts Johnnie-O controls; they are
  profiled here as Johnnie-O's agent surface, not as Johnnie-O-authored API design.
