- aid: johnnie-o:ucp-mcp
  name: Johnnie-O UCP Commerce MCP Endpoint
  description: >-
    Live remote MCP server implementing the Universal Commerce Protocol shopping service
    (version 2026-04-08) on Johnnie-O's Shopify-served primary domain. An anonymous JSON-RPC
    tools/list returns thirteen tools with complete input schemas — search_catalog,
    lookup_catalog, get_product, create_cart, get_cart, update_cart, cancel_cart,
    create_checkout, get_checkout, update_checkout, complete_checkout, cancel_checkout and
    get_order. Tool invocation is gated on a UCP agent profile URI. Capabilities declared at
    /.well-known/ucp cover checkout, cart, fulfillment and discount, with Shop Pay, card and
    Google Pay payment handlers. The store's own llms.txt requires explicit buyer approval
    before any agent completes payment.
  humanURL: https://checkout.johnnie-o.com/llms.txt
