apis:
- aid: johnnie-o:storefront-graphql
  name: Johnnie-O Storefront GraphQL API
  description: >-
    Anonymous, fully introspectable GraphQL endpoint served from Johnnie-O's own Hydrogen
    storefront host. This is the Shopify Storefront API for merchant tenant 22750137; the
    Hydrogen app proxies the request and injects the storefront access token server-side, so
    callers need no credentials. Full introspection returned 414 types, 34 query fields and 41
    mutation fields covering products, variants, collections, carts, customers, blogs, pages,
    metaobjects, localization and Shop Pay sessions. The schema is Shopify's, not Johnnie-O's
    design work, but it is served on a Johnnie-O host and returns Johnnie-O's own commerce
    data.
  humanURL: https://www.johnnie-o.com/
  baseURL: https://www.johnnie-o.com/api/2024-10/graphql.json
