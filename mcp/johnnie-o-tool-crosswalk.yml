mcp_only:
- tool: get_checkout
  reason: The 2024-10 Storefront schema has no checkout query — checkout was replaced by Cart.
    UCP reintroduces a first-class checkout object with no GraphQL counterpart.
- tool: create_checkout
  reason: No Storefront mutation creates a checkout object; cartPrepareForCompletion is the
    nearest concept and returns a cart, not a checkout.
- tool: cancel_checkout
  reason: No Storefront mutation cancels a checkout. This is the only agent-reachable reversal
    for an in-flight checkout.
- tool: cancel_cart
  reason: No Storefront mutation cancels a cart; the GraphQL model expects the cart to be
    abandoned rather than explicitly cancelled.
