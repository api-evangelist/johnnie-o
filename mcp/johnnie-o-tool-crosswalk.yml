note: >-
  Johnnie-O publishes NO OpenAPI. The two machine-readable contracts it serves are a GraphQL
  schema (Shopify Storefront API, anonymously introspectable at
  https://www.johnnie-o.com/api/2024-10/graphql.json) and an MCP tool surface (UCP shopping
  service at https://checkout.johnnie-o.com/api/ucp/mcp). This crosswalk therefore binds MCP
  tools to GraphQL root fields rather than to REST operationIds. Both sides were read live —
  every tool name below came from a 200 tools/list response and every GraphQL field below was
  verified present in the introspected QueryRoot/Mutation. The bindings are semantic, not
  declared by the provider, so confidence is recorded honestly per row: the UCP checkout model
  and the Storefront cart model are related but not isomorphic.
surfaces:
  openapi: null
  openapi_note: No OpenAPI or Swagger document is served on any Johnnie-O host (probed 2026-08-23).
  graphql:
    endpoint: https://www.johnnie-o.com/api/2024-10/graphql.json
    introspection: open
    gated: false
    types: 414
    query_fields: 34
    mutation_fields: 41
  mcp:
    endpoint: https://checkout.johnnie-o.com/api/ucp/mcp
    tools_list: open
    tools_call: gated
    tools_call_note: >-
      tools/call returns JSON-RPC -32001 invalid_profile_url without a UCP agent profile URI.
