note: >-
  Johnnie-O's storefront serves a live, anonymously listable MCP endpoint implementing the
  Universal Commerce Protocol (UCP) shopping service. Discovered from the store's own
  /llms.txt and confirmed against /.well-known/ucp. The server is Shopify platform
  infrastructure running on the merchant's own primary domain (shop id 22750137) — Johnnie-O
  did not author the tool surface, but it is served from a host Johnnie-O controls and it
  transacts Johnnie-O's own catalog, carts, checkouts and orders. Recorded on that basis; the
  full verbatim tools/list response is saved alongside as johnnie-o-mcp-tools-list.json.
deployment:
  mode: remote
  endpoint: https://checkout.johnnie-o.com/api/ucp/mcp
  auth: none
  verified: probed
  note: >-
    tools/list is anonymous and returned HTTP 200 with 13 tools and full inputSchemas.
    tools/call is NOT anonymous: every invocation attempted returned JSON-RPC error -32001
    "UCP discovery failed" / data.code invalid_profile_url ("Unable to fetch agent profile:
    Missing profile uri"), so an agent must present a UCP agent profile URI before any tool
    executes. Schema discovery is open; execution is gated on agent identity.
